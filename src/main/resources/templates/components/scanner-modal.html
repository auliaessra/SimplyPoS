<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<div th:fragment="modal" id="scannerModal"
     style="display:none;position:fixed;inset:0;z-index:9999;
            background:rgba(0,0,0,.9);backdrop-filter:blur(4px);
            -webkit-backdrop-filter:blur(4px);">

    <div style="position:absolute;inset:0;
                display:flex;flex-direction:column;align-items:center;
                justify-content:center;padding:16px;overflow-y:auto;">

        <!-- HEADER -->
        <div style="display:flex;justify-content:space-between;
                    align-items:center;width:100%;max-width:500px;
                    color:#fff;margin-bottom:16px;flex-shrink:0;">
            <div style="flex:1;min-width:0;">
                <div style="font-size:11px;opacity:.8;text-transform:uppercase;
                            letter-spacing:.5px;">
                    <i class="bi bi-upc-scan"></i>
                    <span th:text="#{scanner.title}">Scan Barcode / QR Code</span>
                </div>
                <div id="scannerSubtitle"
                     style="font-size:13px;opacity:.7;margin-top:2px;
                            white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">
                    <span th:text="#{scanner.hint}">Arahkan kamera ke barcode</span>
                </div>
            </div>
            <button type="button" id="scannerCloseBtn"
                    style="background:rgba(255,255,255,.15);border:none;
                           width:44px;height:44px;border-radius:50%;
                           color:#fff;cursor:pointer;font-size:18px;
                           display:flex;align-items:center;justify-content:center;
                           flex-shrink:0;margin-left:12px;">
                <i class="bi bi-x-lg"></i>
            </button>
        </div>

        <!-- SCANNER BOX -->
        <div style="position:relative;width:100%;max-width:500px;
                    aspect-ratio:1;background:#000;border-radius:12px;
                    overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.5);
                    flex-shrink:0;">

            <div id="scannerReader" style="width:100%;height:100%;"></div>

            <!-- Frame -->
            <div id="scannerOverlay"
                 style="position:absolute;inset:0;pointer-events:none;
                        display:flex;align-items:center;justify-content:center;">
                <div style="position:relative;width:70%;aspect-ratio:1;
                            border-radius:12px;overflow:hidden;">
                    <div class="scan-corner scan-tl"></div>
                    <div class="scan-corner scan-tr"></div>
                    <div class="scan-corner scan-bl"></div>
                    <div class="scan-corner scan-br"></div>
                    <div class="scan-line"></div>
                </div>
            </div>

            <!-- Success status -->
            <div id="scannerStatus"
                 style="position:absolute;bottom:16px;left:50%;
                        transform:translateX(-50%);
                        background:rgba(16,124,16,.95);color:#fff;
                        padding:10px 20px;border-radius:20px;
                        font-size:13px;display:none;z-index:3;
                        max-width:90%;white-space:nowrap;
                        overflow:hidden;text-overflow:ellipsis;">
                <i class="bi bi-check-circle-fill"></i>
                <span id="scannerStatusText">Scan berhasil</span>
            </div>

            <!-- Loading -->
            <div id="scannerLoading"
                 style="display:none;position:absolute;inset:0;
                        background:rgba(0,0,0,.7);color:#fff;
                        flex-direction:column;align-items:center;
                        justify-content:center;text-align:center;
                        padding:24px;z-index:4;">
                <i class="bi bi-camera-video"
                   style="font-size:48px;margin-bottom:16px;
                          animation:pulse-scale 1.5s ease-in-out infinite;"></i>
                <div style="font-size:14px;font-weight:600;margin-bottom:8px;">
                    <span th:text="#{scanner.loading.camera}">Menyalakan kamera...</span>
                </div>
                <div style="font-size:11px;opacity:.7;max-width:280px;">
                    <span th:text="#{scanner.loading.hint}">
                        Jika muncul prompt, klik "Izinkan" untuk memberikan akses kamera
                    </span>
                </div>
            </div>

            <!-- Error -->
            <div id="scannerErrorBox"
                 style="display:none;position:absolute;inset:0;
                        background:rgba(0,0,0,.95);color:#fff;
                        flex-direction:column;align-items:center;
                        justify-content:center;text-align:center;
                        padding:24px;z-index:5;">
                <i class="bi bi-camera-video-off"
                   style="font-size:48px;color:#FBBF24;margin-bottom:16px;"></i>
                <div style="font-size:15px;font-weight:600;margin-bottom:8px;">
                    <span th:text="#{scanner.error.title}">Kamera Tidak Dapat Diakses</span>
                </div>
                <div id="scannerErrorMsg"
                     style="font-size:13px;opacity:.85;margin-bottom:20px;
                            max-width:320px;line-height:1.5;">
                    Periksa izin kamera di pengaturan browser
                </div>
                <button type="button" id="scannerRetryBtn"
                        style="background:var(--bc-primary);color:#fff;border:none;
                               padding:10px 20px;border-radius:6px;font-size:14px;
                               cursor:pointer;margin-bottom:12px;
                               display:flex;align-items:center;gap:8px;">
                    <i class="bi bi-arrow-clockwise"></i>
                    <span th:text="#{common.retry}">Coba Lagi</span>
                </button>
            </div>

            <!-- Hint -->
            <div id="scannerHintOverlay"
                 style="position:absolute;inset:0;background:rgba(0,0,0,.6);
                        color:#fff;display:none;flex-direction:column;
                        align-items:center;justify-content:center;
                        text-align:center;padding:24px;z-index:2;">
                <i class="bi bi-upc-scan"
                   style="font-size:48px;margin-bottom:16px;opacity:.7;"></i>
                <div style="font-size:14px;font-weight:600;">
                    <span th:text="#{scanner.ready}">Kamera siap</span>
                </div>
            </div>
        </div>

        <!-- MANUAL INPUT -->
        <div style="width:100%;max-width:500px;margin-top:16px;flex-shrink:0;">
            <div style="display:flex;gap:8px;">
                <input type="text" id="scannerManualInput"
                       class="bc-input"
                       autocomplete="off"
                       th:placeholder="#{scanner.manual.input}"
                       style="flex:1;height:44px;font-size:14px;
                              background:rgba(255,255,255,.1);
                              border:1px solid rgba(255,255,255,.2);
                              color:#fff;padding:0 12px;border-radius:4px;">
                <button type="button" id="scannerManualBtn"
                        style="background:var(--bc-primary);color:#fff;
                               border:none;padding:0 20px;border-radius:4px;
                               cursor:pointer;font-size:14px;font-weight:600;
                               height:44px;display:flex;align-items:center;gap:6px;">
                    <i class="bi bi-arrow-return-left"></i>
                    <span th:text="#{scanner.submit}">Kirim</span>
                </button>
            </div>
            <div style="text-align:center;margin-top:12px;">
                <small style="color:rgba(255,255,255,.5);font-size:11px;">
                    <i class="bi bi-info-circle"></i>
                    <span th:text="#{scanner.manual.hint}">
                        Atau ketik manual barcode jika kamera tidak tersedia
                    </span>
                </small>
            </div>
        </div>

    </div>
</div>

<!-- SCANNER STYLES -->
<style>
@keyframes scanline {
    0%, 100% { top: 10%; opacity: 0; }
    50% { top: 90%; opacity: 1; }
}
@keyframes pulse-scale {
    0%, 100% { transform: scale(1); opacity: .7; }
    50% { transform: scale(1.1); opacity: 1; }
}

.scan-corner {
    position: absolute; width: 40px; height: 40px;
    border-color: #4CC2FF; border-style: solid; border-width: 0;
}
.scan-tl { top: 0; left: 0; border-top-width: 4px; border-left-width: 4px; border-top-left-radius: 12px; }
.scan-tr { top: 0; right: 0; border-top-width: 4px; border-right-width: 4px; border-top-right-radius: 12px; }
.scan-bl { bottom: 0; left: 0; border-bottom-width: 4px; border-left-width: 4px; border-bottom-left-radius: 12px; }
.scan-br { bottom: 0; right: 0; border-bottom-width: 4px; border-right-width: 4px; border-bottom-right-radius: 12px; }

.scan-line {
    position: absolute; left: 10%; right: 10%; height: 2px;
    background: linear-gradient(90deg, transparent, #4CC2FF, transparent);
    box-shadow: 0 0 8px #4CC2FF; top: 0;
    animation: scanline 2s ease-in-out infinite;
}

#scannerReader video {
    width: 100% !important; height: 100% !important; object-fit: cover !important;
}
#scannerReader canvas, #scannerReader img { display: none !important; }
#scannerReader > div { border: none !important; }

@media (max-height: 600px) and (orientation: landscape) {
    #scannerModal > div { padding: 8px !important; }
    #scannerModal [style*="aspect-ratio:1"] { max-width: 60vh !important; }
}
</style>

</body>
</html>
