<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.w3.org/1999/xhtml"
    xmlns:sec="http://www.thymeleaf.org/extras/spring-security" layout:decorate="~{layouts/base}"
    th:lang="${#locale.language}" lang="en">

<head>
    <title th:text="#{settings.title}">Settings</title>
    <th:block layout:fragment="styles">
        <style>
            /* ============================================================
            THEME OPTION BUTTON (Settings)
            ============================================================ */
            .theme-option {
                background: transparent;
                border: 2px solid var(--bc-border);
                border-radius: 8px;
                padding: 12px;
                cursor: pointer;
                transition: all .15s ease;
                font-family: inherit;
                color: var(--bc-text);
            }

            .theme-option:hover {
                border-color: var(--bc-primary);
                transform: translateY(-2px);
                box-shadow: var(--bc-shadow);
            }

            .theme-option.active {
                border-color: var(--bc-primary);
                background: var(--bc-badge-bg);
            }

            .theme-option.active::after {
                content: "✓";
                position: absolute;
                top: 8px;
                right: 8px;
                width: 22px;
                height: 22px;
                border-radius: 50%;
                background: var(--bc-primary);
                color: #fff;
                display: flex;
                align-items: center;
                justify-content: center;
                font-size: 12px;
                font-weight: bold;
            }

            .theme-option {
                position: relative;
            }
        </style>
    </th:block>
</head>

<body>

    <th:block layout:fragment="ribbon">
        <div class="bc-ribbon">
            <a sec:authorize="hasRole('SUPER_ADMIN')" href="/web/settings/edit" class="bc-ribbon-btn bc-primary">
                <i class="bi bi-pencil"></i>
                <span th:text="#{common.edit}">Edit</span>
            </a>
            <div class="bc-ribbon-divider"></div>
            <button type="button" class="bc-ribbon-btn" onclick="location.reload()">
                <i class="bi bi-arrow-clockwise"></i>
                <span th:text="#{common.refresh}">Refresh</span>
            </button>
        </div>
    </th:block>

    <th:block layout:fragment="content">

        <div style="padding:16px 24px;max-width:900px;">

            <!-- ============ LANGUAGE ============ -->
            <div class="bc-card" style="margin:0 0 16px 0;">
                <div class="bc-card-header">
                    <span>
                        <i class="bi bi-translate" style="color:var(--bc-primary);"></i>
                        <span th:text="#{settings.language}">Bahasa &amp; Wilayah</span>
                    </span>
                </div>
                <div class="bc-card-body">
                    <div style="display:flex;gap:12px;flex-wrap:wrap;">
                        <a th:href="@{/locale/set/id}" class="bc-btn" th:classappend="${#locale.language == 'id' or #locale.language == ''} ?
                                       'bc-btn-primary' : 'bc-btn-default'">
                            <span style="font-size:16px;">🇮🇩</span>
                            <span>Bahasa Indonesia</span>
                        </a>
                        <a th:href="@{/locale/set/en}" class="bc-btn" th:classappend="${#locale.language == 'en'} ?
                                       'bc-btn-primary' : 'bc-btn-default'">
                            <span style="font-size:16px;">🇬🇧</span>
                            <span>English</span>
                        </a>
                    </div>
                </div>
            </div>
            <!-- ============ APPEARANCE ============ -->
            <div class="bc-card" style="margin:0 0 16px 0;">
                <div class="bc-card-header">
                    <span>
                        <i class="bi bi-palette" style="color:var(--bc-primary);"></i>
                        <span th:text="#{settings.appearance}">Tampilan</span>
                    </span>
                </div>
                <div class="bc-card-body">
                    <div style="display:grid;grid-template-columns:repeat(3, 1fr);gap:12px;">

                        <!-- Light -->
                        <button type="button" class="theme-option" data-theme-value="light"
                            onclick="setAppTheme('light')">
                            <div style="width:100%;height:80px;border-radius:6px;
                            background:linear-gradient(135deg, #F3F2F1 0%, #FFFFFF 100%);
                            border:1px solid #D2D0CE;
                            display:flex;flex-direction:column;
                            align-items:center;justify-content:center;gap:8px;">
                                <i class="bi bi-sun-fill" style="font-size:24px;color:#FFB900;"></i>
                            </div>
                            <div style="margin-top:8px;font-weight:600;font-size:13px;text-align:center;">
                                <span th:text="#{settings.theme.light}">Terang</span>
                            </div>
                        </button>

                        <!-- Dark -->
                        <button type="button" class="theme-option" data-theme-value="dark"
                            onclick="setAppTheme('dark')">
                            <div style="width:100%;height:80px;border-radius:6px;
                            background:linear-gradient(135deg, #1B1A19 0%, #292827 100%);
                            border:1px solid #3B3A39;
                            display:flex;flex-direction:column;
                            align-items:center;justify-content:center;gap:8px;">
                                <i class="bi bi-moon-stars-fill" style="font-size:24px;color:#4CC2FF;"></i>
                            </div>
                            <div style="margin-top:8px;font-weight:600;font-size:13px;text-align:center;">
                                <span th:text="#{settings.theme.dark}">Gelap</span>
                            </div>
                        </button>

                        <!-- Auto -->
                        <button type="button" class="theme-option" data-theme-value="auto"
                            onclick="setAppTheme('auto')">
                            <div style="width:100%;height:80px;border-radius:6px;
                            background:linear-gradient(135deg, #F3F2F1 0%, #F3F2F1 49.9%, #1B1A19 50%, #1B1A19 100%);
                            border:1px solid #D2D0CE;
                            display:flex;flex-direction:column;
                            align-items:center;justify-content:center;gap:8px;">
                                <i class="bi bi-circle-half" style="font-size:24px;color:#0078D4;"></i>
                            </div>
                            <div style="margin-top:8px;font-weight:600;font-size:13px;text-align:center;">
                                <span th:text="#{settings.theme.auto}">Otomatis</span>
                            </div>
                        </button>
                    </div>

                    <small style="font-size:12px;color:var(--bc-text-secondary);
                      display:block;margin-top:12px;">
                        <i class="bi bi-info-circle"></i>
                        <span th:text="#{settings.theme.hint}">
                            Preferensi tema akan tersimpan di browser Anda.
                        </span>
                    </small>
                </div>
            </div>

            <!-- ============ LOOP GROUPS (read-only) ============ -->
            <div th:each="group : ${groups}" class="bc-card" style="margin:0 0 16px 0;">

                <div class="bc-card-header">
                    <span>
                        <i class="bi" th:classappend="${group.groupIcon}" style="color:var(--bc-primary);"></i>
                        <span th:text="#{${group.groupLabel}}">Group</span>
                    </span>
                </div>

                <div class="bc-card-body">
                    <div th:each="setting : ${group.settings}" class="bc-info-row">
                        <div class="bc-info-label" th:text="${setting.label}">Label</div>

                        <div class="bc-info-value">

                            <!-- STRING / INTEGER -->
                            <span th:if="${setting.settingType == 'STRING'
                                       or setting.settingType == 'INTEGER'}"
                                th:text="${setting.settingValue} ?: '-'">-</span>

                            <!-- BOOLEAN -->
                            <span th:if="${setting.settingType == 'BOOLEAN'}">
                                <span th:if="${setting.asBoolean()}" class="bc-badge bc-badge-success"
                                    th:text="#{common.yes}">Ya</span>
                                <span th:unless="${setting.asBoolean()}" class="bc-badge bc-badge-secondary"
                                    th:text="#{common.no}">Tidak</span>
                            </span>

                            <!-- FILE -->
                            <div th:if="${setting.settingType == 'FILE'}"
                                style="display:flex;align-items:center;gap:8px;">
                                <img th:if="${setting.settingValue != null
                                         and !setting.settingValue.isEmpty()}" th:src="${setting.settingValue}"
                                    alt="Preview" th:style="'object-fit:contain;border:1px solid var(--bc-border);' +
                                           'padding:2px;border-radius:4px;background:#fff;' +
                                           (${setting.settingKey == 'app.favicon.path'}
                                               ? 'width:32px;height:32px;'
                                               : 'max-height:40px;max-width:80px;')">
                                <span th:if="${setting.settingValue == null
                                          or setting.settingValue.isEmpty()}" style="color:var(--bc-text-muted);font-style:italic;
                                         font-size:12px;">
                                    (default)
                                </span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- ============ ABOUT ============ -->
            <div class="bc-card" style="margin:0 0 24px 0;">
                <div class="bc-card-header">
                    <span>
                        <i class="bi bi-info-circle" style="color:var(--bc-primary);"></i>
                        <span th:text="#{settings.about}">Tentang Aplikasi</span>
                    </span>
                </div>
                <div class="bc-card-body">
                    <div class="bc-info-row">
                        <div class="bc-info-label" th:text="#{settings.app.version}">Versi</div>
                        <div class="bc-info-value">1.0.0</div>
                    </div>
                    <div class="bc-info-row">
                        <div class="bc-info-label" th:text="#{settings.app.stack}">Teknologi</div>
                        <div class="bc-info-value">Spring Boot · PostgreSQL · Thymeleaf</div>
                    </div>
                </div>
            </div>

        </div>

    </th:block>
    <th:block layout:fragment="scripts">
        <script>
            (function () {
                const html = document.documentElement;
                const options = document.querySelectorAll('.theme-option');

                function getSavedTheme() {
                    return localStorage.getItem('bc-theme') || 'auto';
                }

                function markActive() {
                    const current = getSavedTheme();
                    options.forEach(opt => {
                        const val = opt.getAttribute('data-theme-value');
                        opt.classList.toggle('active', val === current);
                    });
                }

                window.setAppTheme = function (mode) {
                    if (mode === 'auto') {
                        localStorage.removeItem('bc-theme');
                        const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
                        html.setAttribute('data-theme', prefersDark ? 'dark' : 'light');
                    } else {
                        localStorage.setItem('bc-theme', mode);
                        html.setAttribute('data-theme', mode);
                    }

                    // Update meta theme-color
                    const metaThemeColor = document.querySelector('meta[name="theme-color"]');
                    const currentTheme = html.getAttribute('data-theme');
                    if (metaThemeColor) {
                        metaThemeColor.setAttribute('content',
                            currentTheme === 'dark' ? '#1B1A19' : '#0078D4');
                    }

                    // Trigger theme transition
                    html.classList.add('theme-transition');
                    setTimeout(() => html.classList.remove('theme-transition'), 300);

                    // Update icons di topbar
                    const iconLight = document.querySelector('.theme-icon-light');
                    const iconDark = document.querySelector('.theme-icon-dark');
                    if (iconLight) iconLight.style.display = currentTheme === 'dark' ? 'inline-block' : 'none';
                    if (iconDark) iconDark.style.display = currentTheme === 'light' ? 'inline-block' : 'none';

                    // Update active state
                    markActive();
                };

                // Init active state
                document.addEventListener('DOMContentLoaded', markActive);
            })();
        </script>
    </th:block>
</body>

</html>
