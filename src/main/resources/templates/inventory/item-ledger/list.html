<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.w3.org/1999/xhtml" layout:decorate="~{layouts/base}"
    th:lang="${#locale.language}" lang="en">

<head>
    <title th:text="#{nav.inventory.item.ledger}">Item Ledger</title>
</head>

<body>

    <th:block layout:fragment="ribbon">
        <div class="bc-ribbon">
            <a href="/web/inventory/item-journals" class="bc-ribbon-btn bc-primary">
                <i class="bi bi-sliders"></i>
                <span th:text="#{nav.inventory.item.journal}">Item Journal</span>
            </a>
            <div class="bc-ribbon-divider"></div>
            <button type="button" class="bc-ribbon-btn" onclick="location.reload()">
                <i class="bi bi-arrow-clockwise"></i> <span th:text="#{common.refresh}">Refresh</span>
            </button>
        </div>
    </th:block>

    <th:block layout:fragment="content">
        <div class="bc-filter-bar">
            <form method="get" style="display:flex;gap:8px;align-items:center;flex:1;flex-wrap:wrap;">
                <i class="bi bi-funnel"></i>

                <select th:if="${isSuperAdmin}" name="storeId" class="bc-select">
                    <option value="" th:text="#{common.all.branches}">All Branches</option>
                    <option th:each="s : ${stores}" th:value="${s.id}" th:text="${s.code} + ' - ' + ${s.name}"
                        th:selected="${selectedStoreId != null and selectedStoreId == s.id}"></option>
                </select>

                <select name="itemId" class="bc-select">
                    <option value="" th:text="#{common.select.item}">All Items</option>
                    <option th:each="i : ${items}" th:value="${i.id}" th:text="${i.code} + ' - ' + ${i.name}"
                        th:selected="${selectedItemId != null and selectedItemId == i.id}"></option>
                </select>

                <input type="date" name="from" th:value="${from}" class="bc-input" style="max-width:160px;">
                <span style="color:var(--bc-text-muted);">→</span>
                <input type="date" name="to" th:value="${to}" class="bc-input" style="max-width:160px;">

                <button type="submit" class="bc-btn bc-btn-default bc-btn-sm">
                    <i class="bi bi-search"></i> <span th:text="#{common.filter}">Filter</span>
                </button>
                <a href="/web/inventory/item-ledgers" class="bc-btn bc-btn-default bc-btn-sm">
                    <i class="bi bi-x-circle"></i> <span th:text="#{common.reset}">Reset</span>
                </a>
            </form>
        </div>

        <div class="bc-card" style="margin-top:16px;">
            <table class="bc-table">
                <thead>
                    <tr>
                        <th style="width:120px;" th:text="#{common.date}">Date</th>
                        <th style="width:120px;" th:text="#{common.status.detail}">Doc Type</th>
                        <th style="width:150px;" th:text="#{pi.field.invoice.number}">Doc No</th>
                        <th th:if="${isSuperAdmin}" style="width:140px;" th:text="#{common.store}">Store</th>
                        <th style="width:140px;" th:text="#{items.field.code}">Item</th>
                        <th>Description</th>
                        <th style="width:120px;text-align:right;" th:text="#{ij.field.qty}">Qty (ML)</th>
                        <th style="width:120px;text-align:right;" th:text="#{common.unit.cost}">Unit Cost</th>
                        <th style="width:140px;text-align:right;" th:text="#{common.subtotal.per.line}">Total Cost</th>
                        <th style="width:130px;text-align:right;" th:text="#{ij.field.balance}">Balance</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="l : ${ledgers.content}">
                        <td th:text="${#temporals.format(l.transactionDate, 'dd/MM/yyyy')}"></td>
                        <td>
                            <span class="bc-badge" th:classappend="${l.documentType == 'PURCHASE' ? 'bc-badge-info' :
                                l.documentType == 'SALE' ? 'bc-badge-warning' :
                                l.documentType == 'ADJUSTMENT' ? 'bc-badge-secondary' :
                                l.documentType == 'SALE_VOID' ? 'bc-badge-danger' : 'bc-badge-secondary'}"
                                th:text="${l.documentType}"></span>
                        </td>
                        <td><strong style="color:var(--bc-primary);" th:text="${l.documentNo}"></strong></td>
                        <td th:if="${isSuperAdmin}">
                            <span class="bc-badge bc-badge-info" th:text="${l.store.name}"></span>
                        </td>
                        <td th:text="${l.item.code}"></td>
                        <td style="font-size:12px;color:var(--bc-text-secondary);" th:text="${l.description} ?: '-'">
                        </td>
                        <td style="text-align:right;"
                            th:styleappend="${l.qtyMl > 0} ? 'color:var(--bc-success);font-weight:600;' : 'color:var(--bc-danger);font-weight:600;'"
                            th:text="${#numbers.formatDecimal(l.qtyMl, 0, 'COMMA', 3, 'POINT')}"></td>
                        <td style="text-align:right;"
                            th:text="'Rp ' + ${#numbers.formatDecimal(l.unitCost, 0, 'COMMA', 2, 'POINT')}"></td>
                        <td style="text-align:right;"
                            th:text="'Rp ' + ${#numbers.formatDecimal(l.totalCost, 0, 'COMMA', 2, 'POINT')}"></td>
                        <td style="text-align:right;font-weight:700;color:var(--bc-primary);"
                            th:text="${#numbers.formatDecimal(l.balanceQtyMl, 0, 'COMMA', 3, 'POINT')} + ' ML'"></td>
                    </tr>
                    <tr th:if="${ledgers.content.isEmpty()}">
                        <td th:attr="colspan=${isSuperAdmin} ? 10 : 9">
                            <div class="bc-empty">
                                <i class="bi bi-journal-text"></i>
                                <div th:text="#{common.no.data}">No data</div>
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </th:block>
</body>

</html>
