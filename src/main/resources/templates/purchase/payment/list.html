<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.w3.org/1999/xhtml" layout:decorate="~{layouts/base}"
    th:lang="${#locale.language}" lang="en">

<head>
    <title th:text="#{vp.title}">Vendor Payments</title>
</head>

<body>

    <!-- =========================================================
     RIBBON
     ========================================================= -->
    <th:block layout:fragment="ribbon">
        <div class="bc-ribbon">
            <a href="/web/purchase/vendor-payments/create" class="bc-ribbon-btn bc-primary">
                <i class="bi bi-plus-lg"></i>
                <span th:text="#{vp.new}">New Payment</span>
            </a>
            <a href="/web/purchase/invoices" class="bc-ribbon-btn">
                <i class="bi bi-receipt"></i>
                <span th:text="#{nav.purchase.invoices}">Purchase Invoices</span>
            </a>
            <a href="/web/purchase/orders" class="bc-ribbon-btn">
                <i class="bi bi-cart"></i>
                <span th:text="#{nav.purchase.orders}">Purchase Orders</span>
            </a>
            <div class="bc-ribbon-divider"></div>
            <button type="button" class="bc-ribbon-btn" onclick="window.print()">
                <i class="bi bi-printer"></i>
                <span th:text="#{common.print}">Print</span>
            </button>
            <button type="button" class="bc-ribbon-btn" onclick="exportData()">
                <i class="bi bi-file-earmark-excel"></i>
                <span th:text="#{common.export}">Export</span>
            </button>
            <div class="bc-ribbon-divider"></div>
            <button type="button" class="bc-ribbon-btn" onclick="location.reload()">
                <i class="bi bi-arrow-clockwise"></i>
                <span th:text="#{common.refresh}">Refresh</span>
            </button>
        </div>
    </th:block>

    <!-- =========================================================
     CONTENT
     ========================================================= -->
    <th:block layout:fragment="content">

        <!-- ============ FILTER BAR ============ -->
        <div class="bc-filter-bar">
            <form method="get" style="display:flex;gap:8px;align-items:center;flex:1;">
                <i class="bi bi-funnel" style="color:var(--bc-text-muted);"></i>

                <select th:if="${isSuperAdmin}" name="storeId" class="bc-select" onchange="this.form.submit()">
                    <option value="" th:text="#{common.all.branches}">All Branches</option>
                    <option th:each="s : ${stores}" th:value="${s.id}" th:text="${s.code} + ' - ' + ${s.name}"
                        th:selected="${selectedStoreId != null and selectedStoreId == s.id}"></option>
                </select>
            </form>

            <div style="font-size:12px;color:var(--bc-text-secondary);">
                <span th:text="#{common.total}">Total</span>:
                <strong th:text="${payments.totalElements}">0</strong>
            </div>
        </div>

        <!-- ============ TABLE ============ -->
        <div class="bc-card" style="margin-top:16px;">
            <table class="bc-table">
                <thead>
                    <tr>
                        <th style="width:150px;" th:text="#{vp.field.payment.number}">Payment No</th>
                        <th th:text="#{po.field.vendor}">Vendor</th>
                        <th style="width:150px;" th:text="#{vp.field.pi}">Purchase Invoice</th>
                        <th th:if="${isSuperAdmin}" style="width:160px;" th:text="#{common.store}">Store</th>
                        <th style="width:120px;" th:text="#{vp.field.payment.date}">Date</th>
                        <th style="width:120px;" th:text="#{vp.field.method}">Method</th>
                        <th style="width:160px;text-align:right;" th:text="#{vp.field.amount}">Amount</th>
                        <th style="width:100px;" th:text="#{common.status}">Status</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="p : ${payments.content}">
                        <td>
                            <strong style="color:var(--bc-primary);" th:text="${p.paymentNo}">VPAY0001</strong>
                        </td>
                        <td th:text="${p.vendor.name}">Vendor A</td>
                        <td>
                            <span th:if="${p.purchaseInvoice != null}" style="color:var(--bc-primary);"
                                th:text="${p.purchaseInvoice.invoiceNo}">PI0001</span>
                            <span th:if="${p.purchaseInvoice == null}"
                                style="color:var(--bc-text-muted);font-style:italic;">-</span>
                        </td>
                        <td th:if="${isSuperAdmin}">
                            <span class="bc-badge bc-badge-info" th:text="${p.store.name}">Pusat</span>
                        </td>
                        <td th:text="${#temporals.format(p.paymentDate, 'dd/MM/yyyy')}">14/09/2026</td>
                        <td>
                            <span th:if="${p.paymentMethod == 'CASH'}" class="bc-badge bc-badge-success">
                                <i class="bi bi-cash"></i>
                                <span th:text="#{payment.cash}">CASH</span>
                            </span>
                            <span th:if="${p.paymentMethod == 'TRANSFER'}" class="bc-badge bc-badge-info">
                                <i class="bi bi-bank"></i>
                                <span th:text="#{payment.transfer}">TRANSFER</span>
                            </span>
                            <span th:if="${p.paymentMethod == 'GIRO'}" class="bc-badge bc-badge-warning">
                                <i class="bi bi-file-earmark-text"></i>
                                <span th:text="#{payment.giro}">GIRO</span>
                            </span>
                        </td>
                        <td style="text-align:right;font-weight:600;"
                            th:text="'Rp ' + ${#numbers.formatDecimal(p.amount, 0, 'COMMA', 2, 'POINT')}">
                            Rp 0
                        </td>
                        <td>
                            <span class="bc-badge bc-badge-success" th:text="${p.status}">POSTED</span>
                        </td>
                    </tr>
                    <tr th:if="${payments.content.isEmpty()}">
                        <td th:attr="colspan=${isSuperAdmin} ? 8 : 7">
                            <div class="bc-empty">
                                <i class="bi bi-cash-coin"></i>
                                <div th:text="#{common.no.data}">No data</div>
                                <a href="/web/purchase/vendor-payments/create" class="bc-btn bc-btn-primary"
                                    style="margin-top:12px;">
                                    <i class="bi bi-plus-lg"></i>
                                    <span th:text="#{vp.new}">New Payment</span>
                                </a>
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>

            <!-- ============ PAGINATION ============ -->
            <div class="bc-pagination" th:if="${payments.totalPages > 0}">
                <div>
                    <span th:text="#{common.showing}">Showing</span>
                    <strong th:text="${payments.number * payments.size + 1}">1</strong> –
                    <strong th:text="${payments.number * payments.size + payments.numberOfElements}">10</strong>
                    <span th:text="#{common.of}">of</span>
                    <strong th:text="${payments.totalElements}">0</strong>
                </div>
                <div class="bc-pagination-pages">
                    <a th:href="@{/web/purchase/vendor-payments(page=${payments.number - 1}, storeId=${selectedStoreId})}"
                        class="bc-page-link" th:classappend="${payments.first} ? 'disabled'">
                        <i class="bi bi-chevron-left"></i>
                    </a>
                    <span class="bc-page-link active" th:text="${payments.number + 1}">1</span>
                    <a th:href="@{/web/purchase/vendor-payments(page=${payments.number + 1}, storeId=${selectedStoreId})}"
                        class="bc-page-link" th:classappend="${payments.last} ? 'disabled'">
                        <i class="bi bi-chevron-right"></i>
                    </a>
                </div>
            </div>
        </div>

    </th:block>

    <!-- =========================================================
     SCRIPTS
     ========================================================= -->
    <th:block layout:fragment="scripts">
        <script th:inline="javascript">
            const I18N = {
                exportNotReady: /*[[#{common.export}]]*/ 'Export'
            };

            function exportData() {
                alert(I18N.exportNotReady + ' — coming soon');
            }
        </script>
    </th:block>

</body>

</html>
