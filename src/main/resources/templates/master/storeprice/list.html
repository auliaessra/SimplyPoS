<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.w3.org/1999/xhtml" layout:decorate="~{layouts/base}"
    th:lang="${#locale.language}" lang="en">

<head>
    <title th:text="#{store.price.title}">Store Prices</title>
</head>

<body>

    <th:block layout:fragment="ribbon">
        <div class="bc-ribbon">
            <a href="/web/master/store-prices/create" class="bc-ribbon-btn bc-primary">
                <i class="bi bi-plus-lg"></i>
                <span th:text="#{common.new}">New</span>
            </a>
            <div class="bc-ribbon-divider"></div>
            <button type="button" class="bc-ribbon-btn" onclick="location.reload()">
                <i class="bi bi-arrow-clockwise"></i>
                <span th:text="#{common.refresh}">Refresh</span>
            </button>
        </div>
    </th:block>

    <th:block layout:fragment="content">

        <div class="bc-filter-bar">
            <form method="get" style="display:flex;gap:8px;align-items:center;flex:1;">
                <i class="bi bi-funnel" style="color:var(--bc-text-muted);"></i>
                <select th:if="${isSuperAdmin}" name="storeId" class="bc-select" onchange="this.form.submit()">
                    <option value="" th:text="#{common.all.branches}">All Branches</option>
                    <option th:each="s : ${stores}" th:value="${s.id}" th:text="${s.code} + ' - ' + ${s.name}"
                        th:selected="${selectedStoreId != null and selectedStoreId == s.id}"></option>
                </select>
            </form>
            <div style="font-size:12px;color:var(--bc-text-secondary);">
                <span th:text="#{common.total}">Total</span>:
                <strong th:text="${prices.size()}">0</strong>
            </div>
        </div>

        <div class="bc-card" style="margin-top:16px;">
            <table class="bc-table">
                <thead>
                    <tr>
                        <th style="width:120px;" th:text="#{items.field.code}">Code</th>
                        <th th:text="#{items.field.name}">Item</th>
                        <th th:if="${isSuperAdmin}" style="width:140px;" th:text="#{common.store}">Store</th>
                        <th style="width:130px;text-align:right;" th:text="#{store.price.field.buy}">Harga Beli</th>
                        <th style="width:130px;text-align:right;" th:text="#{store.price.field.sell}">Harga Jual</th>
                        <th style="width:120px;text-align:right;" th:text="#{store.price.field.stock}">Stok</th>
                        <th style="width:100px;text-align:right;" th:text="#{store.price.field.min}">Min</th>
                        <th style="width:140px;text-align:right;" th:text="#{common.actions}">Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="p : ${prices}">
                        <td>
                            <strong style="color:var(--bc-primary);" th:text="${p.itemCode}">PRF-001</strong>
                        </td>
                        <td th:text="${p.itemName}">Parfum Mawar</td>
                        <td th:if="${isSuperAdmin}">
                            <span class="bc-badge bc-badge-info" th:text="${p.storeName}">Pusat</span>
                        </td>

                        <!-- HARGA BELI -->
                        <td style="text-align:right;"
                            th:text="'Rp ' + ${#numbers.formatDecimal(p.buyPrice, 0, 'COMMA', 0, 'POINT')}">
                            Rp 0
                        </td>

                        <!-- HARGA JUAL -->
                        <td style="text-align:right;font-weight:600;color:var(--bc-primary);"
                            th:text="'Rp ' + ${#numbers.formatDecimal(p.sellPrice, 0, 'COMMA', 0, 'POINT')}">
                            Rp 0
                        </td>

                        <!-- ✅ STOK dengan null-safe + unit dinamis -->
                        <td style="text-align:right;">
                            <!-- Low stock (merah) -->
                            <span th:if="${p.stockQtyMl != null
                                    and p.minStockMl != null
                                    and p.stockQtyMl.compareTo(p.minStockMl) <= 0}" class="bc-badge bc-badge-danger"
                                th:text="${#numbers.formatDecimal(p.stockQtyMl, 0, 'COMMA', 2, 'POINT')}
                                   + ' ' + ${p.unitCode}">
                                0 ML
                            </span>
                            <!-- Normal stock (hijau) -->
                            <span th:if="${p.stockQtyMl == null
                                    or p.minStockMl == null
                                    or p.stockQtyMl.compareTo(p.minStockMl) > 0}" class="bc-badge bc-badge-success"
                                th:text="${#numbers.formatDecimal(p.stockQtyMl, 0, 'COMMA', 2, 'POINT')}
                                   + ' ' + ${p.unitCode}">
                                0 ML
                            </span>
                        </td>

                        <!-- ✅ MIN STOCK dengan null-safe -->
                        <td style="text-align:right;color:var(--bc-text-secondary);" th:text="${#numbers.formatDecimal(p.minStockMl, 0, 'COMMA', 2, 'POINT')}
                             + ' ' + ${p.unitCode}">
                            0 ML
                        </td>

                        <td style="text-align:right;">
                            <div class="bc-table-actions" style="justify-content:flex-end;">
                                <a th:href="@{/web/master/store-prices/edit/{id}(id=${p.id})}"
                                    class="bc-btn bc-btn-primary bc-btn-sm" th:title="#{common.edit}">
                                    <i class="bi bi-pencil"></i>
                                </a>
                                <form th:action="@{/web/master/store-prices/delete/{id}(id=${p.id})}" method="post"
                                    style="display:inline;" th:attr="data-confirm=#{common.confirm.delete}">
                                    <button class="bc-btn bc-btn-danger bc-btn-sm" th:title="#{common.delete}">
                                        <i class="bi bi-trash"></i>
                                    </button>
                                </form>
                            </div>
                        </td>
                    </tr>
                    <tr th:if="${prices.isEmpty()}">
                        <td th:attr="colspan=${isSuperAdmin} ? 8 : 7">
                            <div class="bc-empty">
                                <i class="bi bi-tags"></i>
                                <div th:text="#{common.no.data}">No data</div>
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

    </th:block>
</body>

</html>
