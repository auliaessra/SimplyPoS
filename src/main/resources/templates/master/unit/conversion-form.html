<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.w3.org/1999/xhtml" layout:decorate="~{layouts/base}"
    th:lang="${#locale.language}" lang="en">

<head>
    <title th:text="#{units.conversion.title}">Conversion Form</title>
</head>

<body>

    <th:block layout:fragment="ribbon">
        <div class="bc-ribbon">
            <button type="submit" form="convForm" class="bc-ribbon-btn bc-primary">
                <i class="bi bi-check-lg"></i>
                <span th:text="#{common.save}">Save</span>
            </button>
            <div class="bc-ribbon-divider"></div>
            <a href="/web/master/unit-conversions" class="bc-ribbon-btn">
                <i class="bi bi-x-lg"></i>
                <span th:text="#{common.cancel}">Cancel</span>
            </a>
        </div>
    </th:block>

    <th:block layout:fragment="content">
        <div class="bc-card">
            <form id="convForm" th:action="${id != null}
                          ? @{/web/master/unit-conversions/edit/{id}(id=${id})}
                          : @{/web/master/unit-conversions/create}" th:object="${conversion}" method="post">

                <div class="bc-card-header">
                    <span>
                        <i class="bi bi-arrow-left-right" style="color:var(--bc-primary);"></i>
                        <span th:text="${pageTitle}">Konversi Unit</span>
                    </span>
                    <span class="bc-badge bc-badge-secondary" th:text="${id != null} ? 'EDIT' : 'NEW'">NEW</span>
                </div>

                <div class="bc-card-body">

                    <div style="display:grid;grid-template-columns:1fr 100px 1fr;
                            gap:16px;align-items:end;">
                        <div class="bc-form-group">
                            <label class="bc-label required" th:text="#{units.field.from}">Dari Unit</label>
                            <select th:field="*{fromUnitId}" id="fromUnit" class="bc-select" required>
                                <option value="" th:text="#{common.select}">Pilih</option>
                                <option th:each="u : ${units}" th:value="${u.id}"
                                    th:text="${u.code} + ' - ' + ${u.name}"></option>
                            </select>
                        </div>

                        <div style="text-align:center;padding-bottom:8px;">
                            <div style="font-size:24px;color:var(--bc-text-muted);
                                    font-weight:600;">=</div>
                        </div>

                        <div class="bc-form-group">
                            <label class="bc-label required" th:text="#{units.field.to}">Ke Unit</label>
                            <select th:field="*{toUnitId}" id="toUnit" class="bc-select" required>
                                <option value="" th:text="#{common.select}">Pilih</option>
                                <option th:each="u : ${units}" th:value="${u.id}"
                                    th:text="${u.code} + ' - ' + ${u.name}"></option>
                            </select>
                        </div>
                    </div>

                    <div style="display:grid;grid-template-columns:1fr 2fr;gap:16px;
                            margin-top:12px;">
                        <div class="bc-form-group">
                            <label class="bc-label required" th:text="#{units.field.factor}">Faktor Konversi</label>
                            <input type="number" step="0.00000001" min="0.00000001" th:field="*{factor}"
                                id="factorInput" class="bc-input" required
                                style="text-align:right;font-family:monospace;" placeholder="1000">
                            <small style="font-size:11px;color:var(--bc-text-secondary);">
                                <span th:text="#{units.field.factor.hint}">
                                    1 unit asal = berapa unit tujuan
                                </span>
                            </small>
                        </div>

                        <div class="bc-form-group">
                            <label class="bc-label" th:text="#{common.description}">Keterangan</label>
                            <input type="text" th:field="*{notes}" class="bc-input"
                                placeholder="1 Liter = 1000 Mililiter">
                        </div>
                    </div>

                    <!-- ============ PREVIEW ============ -->
                    <div id="preview" style="margin-top:20px;padding:16px 20px;
                            background:linear-gradient(135deg,
                                rgba(0,120,212,.08),rgba(80,230,255,.12));
                            border-left:3px solid var(--bc-primary);
                            border-radius:4px;font-size:15px;">
                        <div style="font-size:11px;color:var(--bc-text-secondary);
                                text-transform:uppercase;letter-spacing:.5px;
                                margin-bottom:6px;">
                            <i class="bi bi-eye"></i>
                            <span th:text="#{common.preview}">Preview</span>
                        </div>
                        <div>
                            <strong>1 <span id="previewFrom" style="color:var(--bc-primary);">?</span></strong>
                            <span style="margin:0 12px;color:var(--bc-text-muted);">=</span>
                            <strong><span id="previewFactor" style="color:var(--bc-success);">?</span>
                                <span id="previewTo" style="color:var(--bc-primary);">?</span></strong>
                        </div>
                    </div>

                    <div class="bc-form-group" style="margin-top:16px;">
                        <label class="bc-checkbox">
                            <input type="checkbox" th:field="*{isActive}">
                            <span th:text="#{common.active}">Aktif</span>
                        </label>
                    </div>

                </div>

                <div class="bc-card-body" style="border-top:1px solid var(--bc-border);">
                    <div class="bc-form-actions" style="margin:0;padding:0;border:none;">
                        <button type="submit" class="bc-btn bc-btn-primary">
                            <i class="bi bi-check-lg"></i>
                            <span th:text="#{common.save}">Simpan</span>
                        </button>
                        <a href="/web/master/unit-conversions" class="bc-btn bc-btn-default">
                            <i class="bi bi-x-lg"></i>
                            <span th:text="#{common.cancel}">Batal</span>
                        </a>
                    </div>
                </div>
            </form>
        </div>
    </th:block>

    <th:block layout:fragment="scripts">
        <script>
            document.addEventListener('DOMContentLoaded', function () {
                const fromSelect = document.getElementById('fromUnit');
                const toSelect = document.getElementById('toUnit');
                const factorInput = document.getElementById('factorInput');
                const previewFrom = document.getElementById('previewFrom');
                const previewFactor = document.getElementById('previewFactor');
                const previewTo = document.getElementById('previewTo');

                function updatePreview() {
                    const fromCode = fromSelect.selectedOptions[0]?.text.split(' - ')[0] || '?';
                    const toCode = toSelect.selectedOptions[0]?.text.split(' - ')[0] || '?';
                    const factor = factorInput.value || '?';

                    previewFrom.textContent = fromCode;
                    previewFactor.textContent = factor;
                    previewTo.textContent = toCode;
                }

                [fromSelect, toSelect, factorInput].forEach(el => {
                    el.addEventListener('change', updatePreview);
                    el.addEventListener('input', updatePreview);
                });

                updatePreview();
            });
        </script>
    </th:block>
</body>

</html>
