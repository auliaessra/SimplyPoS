<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.w3.org/1999/xhtml" layout:decorate="~{layouts/base}"
    th:lang="${#locale.language}" lang="en">

<head>
    <title th:text="#{coa.title}">Chart of Accounts</title>
</head>

<body>

    <th:block layout:fragment="ribbon">
        <div class="bc-ribbon">
            <a href="/web/master/coa/create" class="bc-ribbon-btn bc-primary">
                <i class="bi bi-plus-lg"></i> <span th:text="#{common.new}">New Account</span>
            </a>
            <button type="button" class="bc-ribbon-btn" onclick="window.print()">
                <i class="bi bi-printer"></i> <span th:text="#{common.print}">Print</span>
            </button>
            <div class="bc-ribbon-divider"></div>
            <button type="button" class="bc-ribbon-btn" onclick="location.reload()">
                <i class="bi bi-arrow-clockwise"></i> <span th:text="#{common.refresh}">Refresh</span>
            </button>
        </div>
    </th:block>

    <th:block layout:fragment="content">

        <div class="bc-filter-bar">
            <form method="get" style="display:flex;gap:8px;align-items:center;flex:1;">
                <i class="bi bi-funnel" style="color:var(--bc-text-muted);"></i>
                <input type="text" name="q" th:value="${q}" class="bc-input" th:placeholder="#{common.search} + '...'">
                <button type="submit" class="bc-btn bc-btn-default bc-btn-sm">
                    <i class="bi bi-search"></i> <span th:text="#{common.search}">Search</span>
                </button>
                <a href="/web/master/coa" class="bc-btn bc-btn-default bc-btn-sm">
                    <i class="bi bi-x-circle"></i> <span th:text="#{common.reset}">Reset</span>
                </a>
            </form>
            <div style="font-size:12px;color:var(--bc-text-secondary);">
                <span th:text="#{common.total}">Total</span>:
                <strong th:text="${accounts.size()}">0</strong>
            </div>
        </div>

        <div class="bc-alert bc-alert-info" style="margin:16px 24px 0;">
            <i class="bi bi-info-circle-fill"></i>
            <span th:text="#{coa.info}">Chart of Accounts is global...</span>
        </div>

        <div class="bc-card" style="margin-top:16px;">
            <table class="bc-table">
                <thead>
                    <tr>
                        <th style="width:150px;" th:text="#{coa.field.code}">Code</th>
                        <th th:text="#{coa.field.name}">Name</th>
                        <th style="width:150px;" th:text="#{coa.field.type}">Type</th>
                        <th style="width:200px;" th:text="#{coa.field.parent}">Parent</th>
                        <th style="width:100px;" th:text="#{coa.field.status}">Status</th>
                        <th style="width:120px;text-align:right;" th:text="#{common.actions}">Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="a : ${accounts}">
                        <td><strong style="color:var(--bc-primary);" th:text="${a.accountCode}">1101</strong></td>
                        <td th:text="${a.accountName}">Kas</td>
                        <td>
                            <span class="bc-badge" th:classappend="
                              ${a.accountType == 'ASSET'    ? 'bc-badge-info' :
                              a.accountType == 'LIABILITY' ? 'bc-badge-danger' :
                              a.accountType == 'EQUITY'   ? 'bc-badge-warning' :
                              a.accountType == 'REVENUE'  ? 'bc-badge-success' :
                                                                'bc-badge-secondary'}"
                                th:text="${a.accountType}">ASSET</span>
                        </td>
                        <td th:text="${a.parentName} ?: '-'">-</td>
                        <td>
                            <span th:if="${a.isActive}" class="bc-badge bc-badge-success"
                                th:text="#{common.active}">Active</span>
                            <span th:unless="${a.isActive}" class="bc-badge bc-badge-secondary"
                                th:text="#{common.inactive}">Inactive</span>
                        </td>
                        <td style="text-align:right;">
                            <div class="bc-table-actions" style="justify-content:flex-end;">
                                <a th:href="@{/web/master/coa/edit/{id}(id=${a.id})}"
                                    class="bc-btn bc-btn-default bc-btn-sm" th:title="#{common.edit}">
                                    <i class="bi bi-pencil"></i>
                                </a>
                                <form th:action="@{/web/master/coa/delete/{id}(id=${a.id})}" method="post"
                                    style="display:inline;" th:attr="data-confirm=#{common.confirm.delete}">
                                    <button class="bc-btn bc-btn-danger bc-btn-sm" th:title="#{common.delete}">
                                        <i class="bi bi-trash"></i>
                                    </button>
                                </form>
                            </div>
                        </td>
                    </tr>
                    <tr th:if="${accounts.isEmpty()}">
                        <td colspan="6">
                            <div class="bc-empty">
                                <i class="bi bi-diagram-3"></i>
                                <div th:text="#{common.no.data}">No data</div>
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

    </th:block>
</body>

</html>
