<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.w3.org/1999/xhtml" layout:decorate="~{layouts/base}"
    th:lang="${#locale.language}" lang="en">

<head>
    <title th:text="#{stores.title}">Stores</title>
</head>

<body>

    <th:block layout:fragment="ribbon">
        <div class="bc-ribbon">
            <a href="/web/master/stores/create" class="bc-ribbon-btn bc-primary">
                <i class="bi bi-plus-lg"></i>
                <span th:text="#{common.new}">New</span>
            </a>
            <div class="bc-ribbon-divider"></div>
            <button type="button" class="bc-ribbon-btn" onclick="location.reload()">
                <i class="bi bi-arrow-clockwise"></i>
                <span th:text="#{common.refresh}">Refresh</span>
            </button>
        </div>
    </th:block>

    <th:block layout:fragment="content">

        <div class="bc-alert bc-alert-info" style="margin:16px 24px 0;">
            <i class="bi bi-info-circle-fill"></i>
            <span th:text="#{stores.info}">Kelola data cabang sekolah. Setiap cabang memiliki user, harga, dan stok
                terpisah.</span>
        </div>

        <div class="bc-card" style="margin-top:16px;">
            <table class="bc-table">
                <thead>
                    <tr>
                        <th style="width:120px;" th:text="#{stores.field.code}">Code</th>
                        <th th:text="#{stores.field.name}">Name</th>
                        <th style="width:180px;" th:text="#{stores.field.phone}">Phone</th>
                        <th style="width:200px;" th:text="#{stores.field.email}">Email</th>
                        <th style="width:100px;text-align:right;" th:text="#{stores.field.users}">Users</th>
                        <th style="width:100px;" th:text="#{common.status}">Status</th>
                        <th style="width:180px;text-align:right;" th:text="#{common.actions}">Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="s : ${stores}">
                        <td>
                            <strong style="color:var(--bc-primary);" th:text="${s.code}">PG001</strong>
                        </td>
                        <td>
                            <div style="font-weight:600;" th:text="${s.name}"></div>
                            <div style="font-size:11px;color:var(--bc-text-secondary);" th:if="${s.managerName != null}"
                                th:text="${s.managerName}"></div>
                        </td>
                        <td th:text="${s.phone} ?: '-'">-</td>
                        <td th:text="${s.email} ?: '-'">-</td>
                        <td style="text-align:right;">
                            <span class="bc-badge bc-badge-secondary" th:text="${s.userCount} + ' user'"></span>
                        </td>
                        <td>
                            <span th:if="${s.isActive}" class="bc-badge bc-badge-success"
                                th:text="#{common.active}">Active</span>
                            <span th:unless="${s.isActive}" class="bc-badge bc-badge-secondary"
                                th:text="#{common.inactive}">Inactive</span>
                        </td>
                        <td style="text-align:right;">
                            <div class="bc-table-actions" style="justify-content:flex-end;">
                                <a th:href="@{/web/master/stores/edit/{id}(id=${s.id})}"
                                    class="bc-btn bc-btn-default bc-btn-sm" th:title="#{common.edit}">
                                    <i class="bi bi-pencil"></i>
                                </a>
                                <form th:action="@{/web/master/stores/toggle/{id}(id=${s.id})}" method="post"
                                    style="display:inline;">
                                    <button class="bc-btn bc-btn-default bc-btn-sm"
                                        th:title="${s.isActive} ? 'Nonaktifkan' : 'Aktifkan'">
                                        <i class="bi"
                                            th:classappend="${s.isActive} ? 'bi-toggle-on' : 'bi-toggle-off'"></i>
                                    </button>
                                </form>
                                <form th:action="@{/web/master/stores/delete/{id}(id=${s.id})}" method="post"
                                    style="display:inline;" th:attr="data-confirm=#{stores.confirm.delete}">
                                    <button class="bc-btn bc-btn-danger bc-btn-sm" th:title="#{common.delete}">
                                        <i class="bi bi-trash"></i>
                                    </button>
                                </form>
                            </div>
                        </td>
                    </tr>
                    <tr th:if="${stores.isEmpty()}">
                        <td colspan="7">
                            <div class="bc-empty">
                                <i class="bi bi-shop"></i>
                                <div th:text="#{common.no.data}">No data</div>
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

    </th:block>
</body>

</html>
