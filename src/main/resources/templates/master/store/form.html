<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.w3.org/1999/xhtml" layout:decorate="~{layouts/base}"
    th:lang="${#locale.language}" lang="en">

<head>
    <title th:text="#{stores.title}">Store Form</title>
</head>

<body>

    <th:block layout:fragment="ribbon">
        <div class="bc-ribbon">
            <button type="submit" form="storeForm" class="bc-ribbon-btn bc-primary">
                <i class="bi bi-check-lg"></i>
                <span th:text="#{common.save}">Save</span>
            </button>
            <div class="bc-ribbon-divider"></div>
            <a href="/web/master/stores" class="bc-ribbon-btn">
                <i class="bi bi-x-lg"></i>
                <span th:text="#{common.cancel}">Cancel</span>
            </a>
        </div>
    </th:block>

    <th:block layout:fragment="content">
        <div class="bc-card">
            <form id="storeForm"
                th:action="${id != null} ? @{/web/master/stores/edit/{id}(id=${id})} : @{/web/master/stores/create}"
                th:object="${store}" method="post">

                <div class="bc-card-header">
                    <span>
                        <i class="bi bi-shop" style="color:var(--bc-primary);"></i>
                        <span th:text="${pageTitle}">Store</span>
                    </span>
                    <span class="bc-badge bc-badge-secondary" th:text="${id != null} ? 'EDIT' : 'NEW'">NEW</span>
                </div>

                <div class="bc-card-body">

                    <div style="display:grid;grid-template-columns:200px 1fr;gap:16px;">
                        <div class="bc-form-group">
                            <label class="bc-label required" th:text="#{stores.field.code}">Kode Cabang</label>
                            <input type="text" th:field="*{code}" class="bc-input" placeholder="PG001" required>
                        </div>
                        <div class="bc-form-group">
                            <label class="bc-label required" th:text="#{stores.field.name}">Nama Cabang</label>
                            <input type="text" th:field="*{name}" class="bc-input" placeholder="Simply PoS Pusat"
                                required>
                        </div>
                    </div>

                    <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;">
                        <div class="bc-form-group">
                            <label class="bc-label" th:text="#{stores.field.manager}">Nama Penanggung Jawab</label>
                            <input type="text" th:field="*{managerName}" class="bc-input">
                        </div>
                        <div class="bc-form-group">
                            <label class="bc-label" th:text="#{stores.field.phone}">Telepon</label>
                            <input type="text" th:field="*{phone}" class="bc-input" placeholder="021-xxxxxxxx">
                        </div>
                    </div>

                    <div class="bc-form-group">
                        <label class="bc-label" th:text="#{stores.field.email}">Email</label>
                        <input type="email" th:field="*{email}" class="bc-input" placeholder="pusat@simplypos.com">
                    </div>

                    <div class="bc-form-group">
                        <label class="bc-label" th:text="#{stores.field.address}">Alamat</label>
                        <textarea th:field="*{address}" class="bc-textarea" rows="3"></textarea>
                    </div>

                    <div class="bc-form-group">
                        <label class="bc-checkbox">
                            <input type="checkbox" th:field="*{isActive}">
                            <span th:text="#{common.active}">Aktif</span>
                        </label>
                    </div>
                </div>

                <div class="bc-card-body" style="border-top:1px solid var(--bc-border);">
                    <div class="bc-form-actions" style="margin:0;padding:0;border:none;">
                        <button type="submit" class="bc-btn bc-btn-primary">
                            <i class="bi bi-check-lg"></i>
                            <span th:text="#{common.save}">Save</span>
                        </button>
                        <a href="/web/master/stores" class="bc-btn bc-btn-default">
                            <i class="bi bi-x-lg"></i>
                            <span th:text="#{common.cancel}">Cancel</span>
                        </a>
                    </div>
                </div>
            </form>
        </div>
    </th:block>
</body>

</html>
