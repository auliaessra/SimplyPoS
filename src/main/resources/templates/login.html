<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.w3.org/1999/xhtml" th:lang="${#locale.language}"
    lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <meta name="theme-color" th:content="${loginBgColor}">
    <script>
        (function () {
            try {
                var theme = localStorage.getItem('bc-theme');
                if (!theme) {
                    theme = window.matchMedia('(prefers-color-scheme: dark)').matches
                        ? 'dark' : 'light';
                }
                document.documentElement.setAttribute('data-theme', theme);
            } catch (e) {
                document.documentElement.setAttribute('data-theme', 'light');
            }
        })();
    </script>
    <title th:text="${loginHeadTitle}">Login</title>

    <!-- ============ FAVICON DINAMIS ============ -->
    <link th:if="${faviconPath != null and !faviconPath.isEmpty()}" rel="icon" th:href="${faviconPath}"
        th:type="${#strings.endsWith(faviconPath, '.ico') ? 'image/x-icon' : 'image/png'}">

    <link th:if="${faviconPath == null or faviconPath.isEmpty()}" rel="icon" type="image/svg+xml"
        th:href="@{/favicon.svg}">

    <link th:if="${faviconPath != null and !faviconPath.isEmpty()}" rel="apple-touch-icon" th:href="${faviconPath}">

    <link rel="icon" th:href="${faviconPath + '?t=' + #temporals.format(#temporals.createNow(), 'yyyyMMddHHmmss')}">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link th:href="@{/css/bc365.css}" rel="stylesheet">

    <style>
        /* Login page dark mode */
        [data-theme="dark"] .bc-login-bg {
            background: linear-gradient(135deg, #1B1A19 0%, #292827 50%, #3B3A39 100%) !important;
        }

        [data-theme="dark"] .bc-login-card {
            background: #292827;
            color: #F3F2F1;
        }

        [data-theme="dark"] .bc-login-title {
            color: #F3F2F1;
        }

        [data-theme="dark"] .bc-login-subtitle {
            color: #C8C6C4;
        }

        [data-theme="dark"] .bc-login-card .bc-input {
            background: #1B1A19;
            border-color: #4D4C4B;
            color: #F3F2F1;
        }

        [data-theme="dark"] .bc-login-card .bc-input:focus {
            border-color: #4CC2FF;
            box-shadow: 0 0 0 1px #4CC2FF;
        }
    </style>
</head>

<body>

    <div class="bc-login-bg"
        th:style="'background: linear-gradient(135deg, ' + ${loginBgColor} + ' 0%, #005A9E 100%);'">

        <div class="bc-login-card">

            <!-- ============ LOGO ============ -->
            <div class="bc-login-logo">
                <!-- Jika logo path ada → tampilkan gambar -->
                <img th:if="${loginLogoPath != null and !loginLogoPath.isEmpty()}" th:src="${loginLogoPath}" alt="Logo"
                    style="max-width:80px;max-height:80px;object-fit:contain;">

                <!-- Fallback: teks logo -->
                <div th:if="${loginLogoPath == null or loginLogoPath.isEmpty()}" class="bc-login-logo-icon"
                    th:text="${loginLogoText}">PG</div>
            </div>

            <!-- ============ TITLE & SUBTITLE ============ -->
            <h1 class="bc-login-title" th:text="${loginTitle}">Simply PoS</h1>
            <p class="bc-login-subtitle" th:text="${loginSubtitle}">Business Management System</p>

            <!-- ============ ERROR / SUCCESS ============ -->
            <div th:if="${param.error}" class="bc-alert bc-alert-danger" style="margin:0 0 16px;">
                <i class="bi bi-exclamation-circle"></i>
                <span th:text="#{login.error}">Username atau password salah</span>
            </div>
            <div th:if="${param.logout}" class="bc-alert bc-alert-success" style="margin:0 0 16px;">
                <i class="bi bi-check-circle"></i>
                <span th:text="#{login.logout.success}">Berhasil logout</span>
            </div>

            <!-- ============ FORM ============ -->
            <form th:action="@{/login}" method="post">
                <div class="bc-form-group">
                    <label class="bc-label required" th:text="#{login.username}">Username</label>
                    <input type="text" name="username" class="bc-input" required autofocus
                        th:placeholder="#{login.username.placeholder}">
                </div>
                <div class="bc-form-group">
                    <label class="bc-label required" th:text="#{login.password}">Password</label>
                    <input type="password" name="password" class="bc-input" required
                        th:placeholder="#{login.password.placeholder}">
                </div>
                <button type="submit" class="bc-btn bc-btn-primary"
                    style="width:100%;justify-content:center;padding:12px;">
                    <i class="bi bi-box-arrow-in-right"></i>
                    <span th:text="#{login.submit}">Login</span>
                </button>
            </form>


            <hr>

            <!-- Ukuran kartu dibatasi dengan max-width agar tetap kecil dan ringkas -->
            <div class="card shadow-sm border-light" style="max-w: 540px; font-size: 0.8rem;">

                <!-- Header Kartu -->
                <div
                    class="card-header bg-white py-2 d-flex justify-content-between align-items-center border-bottom-0">
                    <h6 class="card-title mb-0 fw-bold text-secondary text-uppercase tracking-wider"
                        style="font-size: 0.75rem;">
                        🔑 Akun Pengujian (Staging)
                    </h6>
                </div>

                <!-- Konten Tabel Ringkas -->
                <div class="p-0 table-responsive">
                    <table class="table table-sm table-hover mb-0 align-middle">
                        <thead class="table-light" style="font-size: 0.7rem;">
                            <tr>
                                <th scope="col" class="ps-3 text-muted text-uppercase">Role</th>
                                <th scope="col" class="text-muted text-uppercase">Username / Email</th>
                                <th scope="col" class="pe-3 text-muted text-uppercase">Password</th>
                            </tr>
                        </thead>
                        <tbody class="font-monospace text-dark" style="font-size: 0.7rem;">
                            <!-- Akun 1: Super Admin -->
                            <tr>
                                <td class="ps-3 fw-bold text-primary" style="font-family: sans-serif;">Super Admin</td>
                                <td>
                                    <div class="d-flex justify-content-between align-items-center pe-2">
                                        <span>superadmin</span>
                                        <button onclick="navigator.clipboard.writeText('superadmin')"
                                            class="btn btn-link p-0 text-muted lh-1" title="Salin"
                                            style="font-size: 0.75rem;">📋</button>
                                    </div>
                                </td>
                                <td class="pe-3">
                                    <div class="d-flex justify-content-between align-items-center">
                                        <span>superadmin123</span>
                                        <button onclick="navigator.clipboard.writeText('superadmin123')"
                                            class="btn btn-link p-0 text-muted lh-1" title="Salin"
                                            style="font-size: 0.75rem;">📋</button>
                                    </div>
                                </td>
                            </tr>

                            <!-- Akun 2: Admin -->
                            <tr>
                                <td class="ps-3 fw-bold text-warning" style="font-family: sans-serif;">Admin</td>
                                <td>
                                    <div class="d-flex justify-content-between align-items-center pe-2">
                                        <span>admin</span>
                                        <button onclick="navigator.clipboard.writeText('admin')"
                                            class="btn btn-link p-0 text-muted lh-1" title="Salin"
                                            style="font-size: 0.75rem;">📋</button>
                                    </div>
                                </td>
                                <td class="pe-3">
                                    <div class="d-flex justify-content-between align-items-center">
                                        <span>admin123</span>
                                        <button onclick="navigator.clipboard.writeText('admin123')"
                                            class="btn btn-link p-0 text-muted lh-1" title="Salin"
                                            style="font-size: 0.75rem;">📋</button>
                                    </div>
                                </td>
                            </tr>

                            <!-- Akun 3: Cashier -->
                            <tr>
                                <td class="ps-3 fw-bold text-success" style="font-family: sans-serif;">Cashier</td>
                                <td>
                                    <div class="d-flex justify-content-between align-items-center pe-2">
                                        <span>cashier</span>
                                        <button onclick="navigator.clipboard.writeText('cashier')"
                                            class="btn btn-link p-0 text-muted lh-1" title="Salin"
                                            style="font-size: 0.75rem;">📋</button>
                                    </div>
                                </td>
                                <td class="pe-3">
                                    <div class="d-flex justify-content-between align-items-center">
                                        <span>cashier123</span>
                                        <button onclick="navigator.clipboard.writeText('cashier123')"
                                            class="btn btn-link p-0 text-muted lh-1" title="Salin"
                                            style="font-size: 0.75rem;">📋</button>
                                    </div>
                                </td>
                            </tr>

                            <!-- Akun 4: Staff -->
                            <tr>
                                <td class="ps-3 fw-bold text-secondary" style="font-family: sans-serif;">Staff</td>
                                <td>
                                    <div class="d-flex justify-content-between align-items-center pe-2">
                                        <span>staff</span>
                                        <button onclick="navigator.clipboard.writeText('staff')"
                                            class="btn btn-link p-0 text-muted lh-1" title="Salin"
                                            style="font-size: 0.75rem;">📋</button>
                                    </div>
                                </td>
                                <td class="pe-3">
                                    <div class="d-flex justify-content-between align-items-center">
                                        <span>staff123</span>
                                        <button onclick="navigator.clipboard.writeText('staf123')"
                                            class="btn btn-link p-0 text-muted lh-1" title="Salin"
                                            style="font-size: 0.75rem;">📋</button>
                                    </div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- ============ FOOTER ============ -->
            <div style="text-align:center;font-size:11px;
                    color:var(--bc-text-muted);margin-top:24px;" th:text="${loginFooter}">
                © 2026 Simply PoS v1.0
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
