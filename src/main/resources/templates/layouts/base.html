<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.w3.org/1999/xhtml" th:lang="${#locale.language}"
    lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <meta name="theme-color" th:content="${loginBgColor}">
    <!-- ============ ANTI-FLASH THEME SCRIPT (HARUS PALING ATAS) ============ -->
    <script>
        (function () {
            try {
                var theme = localStorage.getItem('bc-theme');
                if (!theme) {
                    // Deteksi system preference
                    theme = window.matchMedia('(prefers-color-scheme: dark)').matches
                        ? 'dark' : 'light';
                }
                document.documentElement.setAttribute('data-theme', theme);
            } catch (e) {
                document.documentElement.setAttribute('data-theme', 'light');
            }
        })();
    </script>
    <title th:text="${loginHeadTitle}">Login</title>

    <!-- ============ FAVICON DINAMIS ============ -->
    <link th:if="${faviconPath != null and !faviconPath.isEmpty()}" rel="icon" th:href="${faviconPath}"
        th:type="${#strings.endsWith(faviconPath, '.ico')} ? 'image/x-icon' : 'image/png'">

    <link th:if="${faviconPath == null or faviconPath.isEmpty()}" rel="icon" type="image/svg+xml"
        th:href="@{/favicon.svg}">

    <link th:if="${faviconPath != null and !faviconPath.isEmpty()}" rel="apple-touch-icon" th:href="${faviconPath}">

    <link rel="icon" th:href="${faviconPath + '?t=' + #temporals.format(#temporals.createNow(), 'yyyyMMddHHmmss')}">

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <!-- BC365 Custom CSS -->
    <link th:href="@{/css/bc365.css}" rel="stylesheet">

    <!-- Page-specific CSS -->
    <th:block layout:fragment="styles"></th:block>
</head>

<body>

    <!-- ============ MOBILE OVERLAY (di luar .bc-app) ============ -->
    <div class="bc-sidebar-overlay" id="sidebarOverlay"></div>

    <div class="bc-app">

        <!-- ============ SIDEBAR ============ -->
        <aside class="bc-sidebar" id="bcSidebar">
            <div th:replace="~{layouts/sidebar :: sidebar}"></div>
        </aside>

        <!-- ============ MAIN ============ -->
        <div class="bc-main">

            <!-- Topbar -->
            <div th:replace="~{layouts/topbar :: topbar}"></div>

            <!-- Content -->
            <main class="bc-content">

                <!-- Flash messages -->
                <div th:if="${success}" class="bc-alert bc-alert-success">
                    <i class="bi bi-check-circle-fill"></i>
                    <span th:text="${success}"></span>
                </div>
                <div th:if="${error}" class="bc-alert bc-alert-danger">
                    <i class="bi bi-exclamation-triangle-fill"></i>
                    <span th:text="${error}"></span>
                </div>

                <!-- Page header -->
                <div th:if="${pageTitle}" class="bc-page-header">
                    <div class="bc-breadcrumb">
                        <a href="/web/dashboard">Home</a>
                        <span> / <span th:text="${pageTitle}"></span></span>
                    </div>
                    <h1 class="bc-page-title">
                        <i class="bi bi-grid-1x2"></i>
                        <span th:text="${pageTitle}">Page</span>
                    </h1>
                </div>

                <!-- Ribbon -->
                <th:block layout:fragment="ribbon"></th:block>

                <!-- Content -->
                <th:block layout:fragment="content"></th:block>

            </main>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- BC365 JS -->
    <script th:src="@{/js/bc365.js}"></script>

    <!-- Page-specific JS -->
    <th:block layout:fragment="scripts"></th:block>
</body>

</html>
