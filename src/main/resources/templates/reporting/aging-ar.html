<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.w3.org/1999/xhtml" layout:decorate="~{layouts/base}"
    th:lang="${#locale.language}" lang="en">

<head>
    <title th:text="#{nav.reports.aging.ar}">AR Aging</title>
</head>

<body>

    <th:block layout:fragment="ribbon">
        <div class="bc-ribbon">
            <button type="button" class="bc-ribbon-btn" onclick="window.print()">
                <i class="bi bi-printer"></i> <span th:text="#{common.print}">Print</span>
            </button>
            <div class="bc-ribbon-divider"></div>
            <a href="/web/reports/aging-ap" class="bc-ribbon-btn">
                <i class="bi bi-hourglass"></i>
                <span th:text="#{nav.reports.aging.ap}">AP Aging</span>
            </a>
        </div>
    </th:block>

    <th:block layout:fragment="content">

        <div class="bc-filter-bar">
            <form method="get" style="display:flex;gap:8px;align-items:center;flex:1;">
                <i class="bi bi-funnel"></i>
                <select th:if="${isSuperAdmin}" name="storeId" class="bc-select">
                    <option value="" th:text="#{common.all.branches}">All Branches</option>
                    <option th:each="s : ${stores}" th:value="${s.id}" th:text="${s.code} + ' - ' + ${s.name}"
                        th:selected="${selectedStoreId != null and selectedStoreId == s.id}"></option>
                </select>
                <input type="date" name="asOf" th:value="${asOf}" class="bc-input" style="max-width:180px;">
                <button type="submit" class="bc-btn bc-btn-primary bc-btn-sm">
                    <i class="bi bi-search"></i> <span th:text="#{common.filter}">Filter</span>
                </button>
            </form>
        </div>

        <div class="bc-card" style="margin-top:16px;">
            <div class="bc-card-header">
                <span>
                    <i class="bi bi-hourglass-split" style="color:var(--bc-primary);"></i>
                    <span th:text="#{aging.ar.title}">AR Aging Report</span>
                </span>
                <span style="font-size:12px;color:var(--bc-text-secondary);">
                    <span th:text="#{aging.as.of}">As of</span>:
                    <strong th:text="${#temporals.format(asOf, 'dd MMM yyyy')}"></strong>
                </span>
            </div>
            <table class="bc-table">
                <thead>
                    <tr>
                        <th style="width:120px;" th:text="#{customers.field.code}">Code</th>
                        <th th:text="#{customers.field.name}">Name</th>
                        <th style="width:130px;text-align:right;" th:text="#{aging.current}">Current</th>
                        <th style="width:120px;text-align:right;" th:text="#{aging.1.30}">1-30</th>
                        <th style="width:120px;text-align:right;" th:text="#{aging.31.60}">31-60</th>
                        <th style="width:120px;text-align:right;" th:text="#{aging.61.90}">61-90</th>
                        <th style="width:120px;text-align:right;" th:text="#{aging.90.plus}">&gt; 90</th>
                        <th style="width:150px;text-align:right;" th:text="#{common.total}">Total</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="r : ${report.rows}">
                        <td><strong style="color:var(--bc-primary);" th:text="${r.partyCode}"></strong></td>
                        <td th:text="${r.partyName}"></td>
                        <td style="text-align:right;"
                            th:text="${r.current > 0} ? 'Rp ' + ${#numbers.formatDecimal(r.current, 0, 'COMMA', 0, 'POINT')} : '-'">
                        </td>
                        <td style="text-align:right;"
                            th:text="${r.days1to30 > 0} ? 'Rp ' + ${#numbers.formatDecimal(r.days1to30, 0, 'COMMA', 0, 'POINT')} : '-'">
                        </td>
                        <td style="text-align:right;"
                            th:text="${r.days31to60 > 0} ? 'Rp ' + ${#numbers.formatDecimal(r.days31to60, 0, 'COMMA', 0, 'POINT')} : '-'">
                        </td>
                        <td style="text-align:right;"
                            th:text="${r.days61to90 > 0} ? 'Rp ' + ${#numbers.formatDecimal(r.days61to90, 0, 'COMMA', 0, 'POINT')} : '-'">
                        </td>
                        <td style="text-align:right;font-weight:600;color:var(--bc-danger);"
                            th:text="${r.over90 > 0} ? 'Rp ' + ${#numbers.formatDecimal(r.over90, 0, 'COMMA', 0, 'POINT')} : '-'">
                        </td>
                        <td style="text-align:right;font-weight:700;"
                            th:text="'Rp ' + ${#numbers.formatDecimal(r.total, 0, 'COMMA', 0, 'POINT')}"></td>
                    </tr>
                    <tr th:if="${report.rows.isEmpty()}">
                        <td colspan="8">
                            <div class="bc-empty">
                                <i class="bi bi-check2-circle" style="color:var(--bc-success);"></i>
                                <div th:text="#{cl.empty}">No Outstanding AR</div>
                            </div>
                        </td>
                    </tr>
                </tbody>
                <tfoot th:if="${!report.rows.isEmpty()}">
                    <tr style="background:var(--bc-bg-sidebar);font-weight:700;">
                        <td colspan="2" style="text-align:right;padding:12px;" th:text="#{common.total}">TOTAL</td>
                        <td style="text-align:right;padding:12px;"
                            th:text="'Rp ' + ${#numbers.formatDecimal(report.totalCurrent, 0, 'COMMA', 0, 'POINT')}">
                        </td>
                        <td style="text-align:right;padding:12px;"
                            th:text="'Rp ' + ${#numbers.formatDecimal(report.total1to30, 0, 'COMMA', 0, 'POINT')}"></td>
                        <td style="text-align:right;padding:12px;"
                            th:text="'Rp ' + ${#numbers.formatDecimal(report.total31to60, 0, 'COMMA', 0, 'POINT')}">
                        </td>
                        <td style="text-align:right;padding:12px;"
                            th:text="'Rp ' + ${#numbers.formatDecimal(report.total61to90, 0, 'COMMA', 0, 'POINT')}">
                        </td>
                        <td style="text-align:right;padding:12px;color:var(--bc-danger);"
                            th:text="'Rp ' + ${#numbers.formatDecimal(report.totalOver90, 0, 'COMMA', 0, 'POINT')}">
                        </td>
                        <td style="text-align:right;padding:12px;color:var(--bc-primary);font-size:15px;"
                            th:text="'Rp ' + ${#numbers.formatDecimal(report.grandTotal, 0, 'COMMA', 0, 'POINT')}"></td>
                    </tr>
                </tfoot>
            </table>
        </div>

    </th:block>
</body>

</html>
