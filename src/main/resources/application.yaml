app:
  display:
    name: "Simply PoS"
    version: "2.5.1"
    logo: "SP"

server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: simply-post-api

  datasource:
    url: jdbc:postgresql://localhost:5432/simply_pos
    username: simply_pos
    password: simply_pos
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate # Flyway mengelola skema, JPA hanya validasi
      # naming:
      #   physical-strategy: org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
        hbm2ddl:
          halt_on_error: false   # temp: log all mismatches instead of failing on first
          
  web:
    resources:
      static-locations: classpath:/static/,file:uploads/
      cache:
        period: 3600

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 10MB

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  thymeleaf:
    cache: false
    prefix: classpath:/templates/
    suffix: .html

  messages:
    basename: messages
    encoding: UTF-8
    fallback-to-system-locale: false
    use-code-as-default-message: false
    always-use-message-format: false
    cache-duration: 3600

jwt:
  secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970} # min 256 bit
  expiration-ms: 28800000 # 8 jam

store:
  header: X-Store-Id # header untuk context switching

logging:
  level:
    com.simplypos: DEBUG
    org.springframework.security: DEBUG